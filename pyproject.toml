[project]
name = "marketing-briefing-bot"
version = "0.1.0"
description = "AI-powered Telegram bot for Agency agency - automates ClickUp task creation from client briefings"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-telegram-bot[job-queue]>=21.0",
    "agno>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "pymupdf4llm>=0.0.17",
    "pyjwt>=2.0.0",
    "passlib[bcrypt]>=1.7.0",
    "email-validator>=2.0.0",
    "boto3>=1.35.0",
    "Pillow>=10.0.0",
    "groq>=0.4.0",
    "jinja2>=3.1.0",
    "psycopg[binary]>=3.1.0",
    "fpdf2>=2.8.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "respx>=0.22.0",
]
observability = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "openinference-instrumentation-agno>=0.1.25",
    "openinference-semantic-conventions>=0.1.0",
    "langfuse>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# =============================================================================
# Langfuse v3 - Self-Hosted Observability Stack
# =============================================================================
# Marketing Briefing Bot - Multi-Agent Observability
# Updated: February 2026
#
# Architecture:
# - Langfuse Web (Next.js dashboard) - :3100
# - Langfuse Worker (Async processing) - :3030
# - ClickHouse 24.3 (OLAP traces storage) - NEW in v3
#
# External Resources (from existing marketing_bot):
# - PostgreSQL: Uses existing marketing_bot database (Langfuse manages its own schema via Prisma)
# - S3: MinIO for local dev, AWS S3 for production
# - Redis: Local Redis container for caching
#
# NOTE: PostgreSQL container not included - using external database
# =============================================================================

networks:
  langfuse-network:
    driver: bridge

services:
  # ===========================================================================
  # Langfuse Web - Dashboard & API
  # ===========================================================================
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-web
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3100:3000"
    environment:
      # ---------------------------------------------------------------------
      # Database Configuration (External PostgreSQL - marketing_bot database)
      # Langfuse manages its own schema via Prisma migrations
      # ---------------------------------------------------------------------
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}
      - DIRECT_URL=${LANGFUSE_DATABASE_URL}

      # ---------------------------------------------------------------------
      # ClickHouse Configuration (NEW in v3)
      # ---------------------------------------------------------------------
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:clickhouse@clickhouse:9000/default

      # ---------------------------------------------------------------------
      # Authentication & Security
      # ---------------------------------------------------------------------
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3100}

      # ---------------------------------------------------------------------
      # Redis (Local container for caching)
      # ---------------------------------------------------------------------
      - REDIS_CONNECTION_STRING=redis://redis:6379

      # ---------------------------------------------------------------------
      # S3 Storage (MinIO for local, AWS S3 for production)
      # ---------------------------------------------------------------------
      - LANGFUSE_S3_EVENT_UPLOAD_ENABLED=true
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true

      # ---------------------------------------------------------------------
      # Prisma Configuration
      # ---------------------------------------------------------------------
      - PRISMA_TRANSACTION_TIMEOUT=15000

      # ---------------------------------------------------------------------
      # Telemetry
      # ---------------------------------------------------------------------
      - TELEMETRY_ENABLED=true
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Langfuse Worker - Async Processing (NEW in v3)
  # ===========================================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3030:3030"
    environment:
      # ---------------------------------------------------------------------
      # Database Configuration (External PostgreSQL - marketing_bot database)
      # ---------------------------------------------------------------------
      - DATABASE_URL=${LANGFUSE_DATABASE_URL}

      # ---------------------------------------------------------------------
      # ClickHouse Configuration (NEW in v3)
      # ---------------------------------------------------------------------
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:clickhouse@clickhouse:9000/default

      # ---------------------------------------------------------------------
      # Security
      # ---------------------------------------------------------------------
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}

      # ---------------------------------------------------------------------
      # Redis (Local container for caching)
      # ---------------------------------------------------------------------
      - REDIS_CONNECTION_STRING=redis://redis:6379

      # ---------------------------------------------------------------------
      # S3 Storage (MinIO for local, AWS S3 for production)
      # ---------------------------------------------------------------------
      - LANGFUSE_S3_EVENT_UPLOAD_ENABLED=true
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minioadmin
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true

      # ---------------------------------------------------------------------
      # Prisma Configuration
      # ---------------------------------------------------------------------
      - PRISMA_TRANSACTION_TIMEOUT=15000
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # ClickHouse - OLAP Traces Storage (NEW in v3)
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
      - "9181:9181"  # Keeper interface
    environment:
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-config/config.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # Redis - Local Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MinIO - Local S3-Compatible Storage (Required by Langfuse v3)
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: langfuse-minio
    restart: unless-stopped
    ports:
      - "9002:9000"   # API
      - "9001:9001"   # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO bucket setup (one-time init)
  minio-init:
    image: minio/mc:RELEASE.2025-02-15T12-15-41Z
    container_name: langfuse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/langfuse --ignore-existing;
      exit 0;
      "
    networks:
      - langfuse-network

volumes:
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
